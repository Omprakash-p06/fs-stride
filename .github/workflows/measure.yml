name: measure

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  sweep:
    name: sweep (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: analysis/requirements.lock
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r analysis/requirements.lock
      - name: Build and sweep
        run: make all
      - name: Upload measurement bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-${{ matrix.runner }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            results/**/raw.csv
            results/**/meta.json
            results/**/summary.json
            results/**/summary.csv
            results/**/report.md
            results/**/env.log
            results/**/figs/*.png
