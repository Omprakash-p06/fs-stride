[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fs-stride-analysis"
version = "0.1.0"
description = "Paired-block log-ratio statistical analyzer for fs-stride cache-line sweeps"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.26.0",
    "numpy==2.5.5",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
]

[project.scripts]
fs-stride-analyze = "fs_stride_analysis.cli:main"

[tool.ruff]
line-length = 120

[tool.setuptools.packages.find]
where = ["."]
include = ["fs_stride_analysis*"]
